<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%231f4dff%22/%3E%3C/svg%3E" />
    <title>New Act — Wave Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Mrs+Saint+Delafield&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="waves" aria-hidden="true"></canvas>

    <main class="poster">
      <h1 class="title" aria-label="New Act">
        <span class="title__line">NEW</span>
        <span class="title__line title__line--act">ACT</span>
      </h1>

      <div class="logo" aria-label="The Leader Entertainment">
        <svg class="logo__mark" viewBox="0 0 40 40" aria-hidden="true">
          <g fill="currentColor">
            <rect x="4" y="4" width="8" height="8" />
            <rect x="20" y="4" width="8" height="8" />
            <rect x="12" y="12" width="8" height="8" />
            <rect x="4" y="20" width="8" height="8" />
            <rect x="20" y="20" width="8" height="8" />
            <rect x="12" y="28" width="8" height="8" />
            <path d="M28 12h8l-8 24h-8z" />
          </g>
        </svg>
        <div class="logo__text">
          <span class="logo__name">THE LEADER</span>
          <span class="logo__sub">ENTERTAINMENT</span>
        </div>
      </div>

      <p class="signature">Hoàng Thùy Linh</p>
      <p class="copyright">(C)2026 THE LEADER ENTERTAINMENT<br />ALL RIGHTS RESERVED.</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
