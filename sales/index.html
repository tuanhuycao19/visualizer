<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%222%22 width=%2214%22 height=%223%22 rx=%221.5%22 fill=%22%23f0333f%22/%3E%3Crect x=%221%22 y=%226.5%22 width=%2211%22 height=%223%22 rx=%221.5%22 fill=%22%23f2682f%22/%3E%3Crect x=%221%22 y=%2211%22 width=%227%22 height=%223%22 rx=%221.5%22 fill=%22%23f5a516%22/%3E%3C/svg%3E" />
    <title>Xe Trung Quốc 3D</title>
    <meta name="description" content="Biểu đồ 3D động: doanh số xe Trung Quốc tại Việt Nam tháng 9/2026." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,700;0,800;0,900;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="header">
      <h1 class="title">
        <span class="title__line">Doanh số xe Trung Quốc</span>
        <span class="title__line title__line--accent">tại Việt Nam</span>
      </h1>
      <p class="period" id="period"></p>
    </header>

    <!-- HTML labels pinned to the 3D bars every frame (crisp text at any DPI). -->
    <div class="labels" id="labels" role="list" aria-label="Bảng xếp hạng doanh số"></div>

    <footer class="footer">
      <p class="total">Tổng: <strong id="total">0</strong> xe</p>
      <p class="source">Nguồn: tổng hợp từ bài đăng người dùng cung cấp.</p>
      <button class="replay" id="replay" type="button" data-record-ignore aria-label="Phát lại animation">↻ Phát lại</button>
    </footer>

    <script type="module" src="/src/sales/main.js"></script>
  </body>
</html>
